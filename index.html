<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Water Map Rescue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: demo bar on top, role sidebar on the right (RTL), working area of plain cards and tables; the public schedule is a single mobile-first column. */
:root{
  --bg:#EDF3F8; --surface:#FFFFFF; --surface2:#F3F8FB; --line:#D5E2EB;
  --ink:#0B2540; --muted:#53708A;
  --brand:#0B4F8A; --brand-ink:#FFFFFF; --aqua:#0E9AA7; --aqua-soft:#D9F2F4;
  --ok:#17794A; --ok-soft:#DCF3E5; --warn:#A8500A; --warn-soft:#FCE9D0;
  --bad:#B42318; --bad-soft:#FCE1DD; --info:#1D5FA8; --info-soft:#DBEAF9;
  --gray:#4B5F72; --gray-soft:#E5ECF2;
  --side:#0B2F4F; --side-ink:#CFE2F0;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-head:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08172A; --surface:#0E2238; --surface2:#122B45; --line:#234560;
  --ink:#E7F1F9; --muted:#93B1C8;
  --brand:#5EAEEA; --brand-ink:#04182A; --aqua:#2CC5D2; --aqua-soft:#0F3C48;
  --ok:#5FD9A0; --ok-soft:#10382A; --warn:#F2B16B; --warn-soft:#42290D;
  --bad:#FF8F82; --bad-soft:#47201C; --info:#7FBBF0; --info-soft:#143A5E;
  --gray:#A7BBCB; --gray-soft:#1C3449; --side:#050F1B; --side-ink:#BCD4E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08172A; --surface:#0E2238; --surface2:#122B45; --line:#234560;
  --ink:#E7F1F9; --muted:#93B1C8;
  --brand:#5EAEEA; --brand-ink:#04182A; --aqua:#2CC5D2; --aqua-soft:#0F3C48;
  --ok:#5FD9A0; --ok-soft:#10382A; --warn:#F2B16B; --warn-soft:#42290D;
  --bad:#FF8F82; --bad-soft:#47201C; --info:#7FBBF0; --info-soft:#143A5E;
  --gray:#A7BBCB; --gray-soft:#1C3449; --side:#050F1B; --side-ink:#BCD4E6; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:24px}h2{font-size:17px;margin-bottom:12px}h3{font-size:15px;margin:16px 0 8px}
p{margin:0}button{font-family:inherit}
.muted{color:var(--muted)}.tiny{font-size:12.5px}.num{font-variant-numeric:tabular-nums;font-weight:700}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.ic{flex:none}

.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--side);color:var(--side-ink);
  padding:8px 14px;border-radius:0 0 12px 12px;font-size:13px}
.demo .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo select{width:auto;padding:4px 8px;background:var(--surface);font-size:13px}
.demo .btn{padding:3px 10px;font-size:12.5px;background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.28)}
.demo .tag{background:var(--aqua);color:#04202A;border-radius:999px;padding:1px 10px;font-weight:600}

.shell{display:grid;grid-template-columns:244px minmax(0,1fr);gap:16px;margin-top:14px;padding-bottom:48px}
.side{background:var(--side);color:var(--side-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 12px;color:#fff;font-family:var(--font-head);font-weight:600}
.brand small{display:block;font-family:var(--font-body);font-weight:400;opacity:.75;font-size:12px}
.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:start;padding:10px 12px;border-radius:9px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav .cnt{margin-inline-start:auto;background:var(--aqua);color:#04202A;border-radius:999px;font-size:12px;padding:0 8px;font-weight:700}
.side .who{margin-top:auto;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.15);font-size:13px}
.side .who b{display:block;color:#fff}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.menu-btn{display:none;align-self:flex-start}
.bd{display:none}

.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.phm{flex:1;min-width:220px}.phm p{margin-top:2px}
.pha{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{color:var(--muted);font-size:13px}
.stat b{font-family:var(--font-head);font-size:24px;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}.stat.info b{color:var(--info)}.stat.aqua b{color:var(--aqua)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row>div{min-width:0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}

.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--gray)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}
.badge.aqua{background:var(--aqua-soft);color:var(--aqua)}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:14px;font-weight:500;line-height:1.4}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.aqua{background:var(--aqua);color:#032028;border-color:var(--aqua)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:transparent}.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:13.5px}
.req{color:var(--bad);margin-inline-start:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--brand);flex:none}
textarea{resize:vertical}
.field small{color:var(--muted);font-size:12.5px}
.err{color:var(--bad);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.form{display:flex;flex-direction:column;gap:14px}
.fa{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.search{display:flex;flex-wrap:wrap;gap:10px}.search>*{flex:1;min-width:150px}

.bar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--aqua)}.bar.over i{background:var(--bad)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 18px}
.kv{display:flex;flex-direction:column;min-width:0}.kv span{color:var(--muted);font-size:12.5px}.kv b{font-weight:600;overflow-wrap:anywhere}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clist li{display:flex;gap:8px;align-items:flex-start}.clist .ic{color:var(--ok);margin-top:4px}
.note{padding:10px 14px;border-radius:10px;background:var(--info-soft);color:var(--info);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink)}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;cursor:pointer;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:4px}
.tl li.done .dot{background:var(--ok);border-color:var(--ok)}
.tl li.cur .dot{background:var(--aqua);border-color:var(--aqua);box-shadow:0 0 0 4px var(--aqua-soft)}
.tl li.rej .dot{background:var(--bad);border-color:var(--bad)}
.tl li.todo{color:var(--muted)}.tl small{display:block;color:var(--muted)}.tl p{margin-top:2px;font-size:13.5px}

.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);display:flex;gap:10px;align-items:flex-start}
.stage .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);color:var(--gray);font-weight:700;flex:none;font-size:13px}
.stage.done .n{background:var(--ok);color:#fff}.stage.rej .n{background:var(--bad);color:#fff}.stage.cur .n{background:var(--aqua);color:#032028}
.stage b{display:block}.stage small{color:var(--muted)}

.steps{display:flex;flex-wrap:wrap;gap:6px}
.st{padding:5px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.st.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}.st.cur{background:var(--aqua);color:#032028;border-color:transparent;font-weight:700}

.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--aqua);box-shadow:0 0 0 2px var(--aqua-soft)}
.day h3{margin:0;font-size:14px}.day h3 small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ap{text-align:start;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:8px;cursor:pointer;font-size:13px;width:100%}
.ap:hover{border-color:var(--brand)}.ap b{font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.acard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.acard.sel{border-color:var(--aqua);box-shadow:0 0 0 2px var(--aqua-soft)}
.mini{display:flex;align-items:center;gap:8px;font-size:12.5px}.mini .bar{flex:1;height:6px}

.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:linear-gradient(135deg,var(--aqua-soft),var(--info-soft));display:grid;place-items:center;overflow:hidden;color:var(--brand)}
.tile img{width:100%;height:100%;object-fit:cover}
.mcap{font-size:13px;display:flex;flex-direction:column;gap:3px;margin-top:6px}

.modal-bg{position:fixed;inset:0;background:rgba(4,18,32,.58);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.mact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:200;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}

.login{max-width:1000px;margin:24px auto 60px;display:flex;flex-direction:column;gap:22px}
.hero{background:linear-gradient(160deg,var(--side),#0B4F8A);color:#fff;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:30px}.hero p{max-width:62ch;opacity:.92}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.rolecard{text-align:start;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:14px}
.rolecard:hover{border-color:var(--aqua)}.rolecard h2{margin:0;display:flex;gap:8px;align-items:center}
.rolecard .go{margin-top:auto;color:var(--brand);font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
.flow li b{color:var(--aqua)}

.pub{max-width:720px;margin:14px auto 60px;display:flex;flex-direction:column;gap:14px}
.pubh{display:flex;gap:12px;align-items:center}
.pubday{display:flex;flex-direction:column;gap:8px}
.pubday h2{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.pubrow{display:flex;gap:12px;align-items:center;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font-size:15px}
.pubrow .t{font-family:var(--font-head);font-weight:600;min-width:84px;color:var(--brand)}
.pubrow .a{flex:1;min-width:0;font-weight:600}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;right:0;width:min(290px,86vw);z-index:60;border-radius:14px 0 0 14px;max-height:none;
    padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 14px;
    transform:translateX(110%);transition:transform .2s}
  .side.open{transform:none}
  .bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .menu-btn{display:inline-flex}
  h1{font-size:21px}.hero h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
document.documentElement.lang='ar';document.documentElement.dir='rtl';

/* ---------- helpers ---------- */
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad=n=>String(n).padStart(2,'0');
const fmtD=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const dayName=iso=>AR_DAYS[new Date(iso+'T00:00:00').getDay()];
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const weekStartOf=iso=>addDays(iso,-((new Date(iso+'T00:00:00').getDay()+1)%7));
const fmtT=t=>{if(!t)return '—';const h=+t.slice(0,2),m=t.slice(3,5);return (h%12||12)+':'+m+' '+(h<12?'ص':'م')};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const fq=n=>Number(n||0).toLocaleString('en-US')+' م³';
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const RL={pc:'منسق المشروع',sm:'مسؤول المحطة',fc:'المنسق الميداني'};

const IC={
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 station:'<path d="M4 20V9l5-3v3l5-3v3l6-3v14z"/><path d="M8 20v-4h3v4"/>',
 truck:'<path d="M2 6h11v10H2z"/><path d="M13 9h5l3 3v4h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
 report:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
 file:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 14l2 2 4-4"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 arrow:'<path d="M9 5l7 7-7 7"/>',
 camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>',
 video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>',

 if(o.type==='select')c='<select id="'+id+'" name="'+name+'" data-f="'+f+'">'+o.opts.map(x=>'<option value="'+esc(x[0])+'"'+(String(v)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select>';

 else c='<input id="'+id+'" name="'+name+'" data-f="'+f+'" type="'+(o.type||'text')+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'"'+(o.min!=null?' min="'+o.min+'"':'')+(o.max!=null?' max="'+o.max+'"':'')+(o.step?' step="'+o.step+'"':'')+(o.ro?' readonly':'')+'>';
 return '<div class="field">'+'<label for="'+id+'">'+label+(o.req?'<span class="req">*</span>':'')+'</label>'+c+(o.hint?'<small>'+o.hint+'</small>':'')+(er?'<div class="err" role="alert">'+er+'</div>':'')+'</div>'}
const chk=(f,name,label)=>'<label class="chk" for="'+f+'-'+name+'"><input type="checkbox" id="'+f+'-'+name+'" name="'+name+'" data-f="'+f+'"'+(D(f)[name]?' checked':'')+'><span>'+label+'</span></label>';
const errOf=(f,k)=>{const e=(ui.err[f]||{})[k];return e?'<div class="err" role="alert">'+e+'</div>':''};
const badge=(t,tone)=>'<span class="badge '+(tone||'')+'">'+t+'</span>';

const stat=(l,v,tone)=>'<div class="stat '+(tone||'')+'"><span>'+l+'</span><b>'+v+'</b></div>';
const bar=(a,b,over)=>{const p=b>0?Math.min(100,Math.round(a/b*100)):0;return '<div class="bar'+(over?' over':'')+'" role="img" aria-label="'+p+'%"><i style="width:'+p+'%"></i></div>'};
const empty=(t,s)=>'<div class="empty"><b>'+t+'</b>'+(s?'<p>'+s+'</p>':'')+'</div>';
const kv=(k,v)=>'<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>';
const head=(title,sub,actions,back)=>'<div class="ph">'+(back?'<button class="btn sm ghost" data-a="back" aria-label="رجوع">'+ic('arrow',16)+' رجوع</button>':'')+'<div class="phm"><h1>'+title+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div><div class="pha">'+(actions||'')+'</div></div>';
const tbl=(cols,rows,emptyMsg)=>rows.length?'<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th scope="col">'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="card">'+empty(emptyMsg||'لا توجد بيانات')+'</div>';
const goBtn=(label,to,id,extra)=>'<button class="btn sm" data-a="go" data-to="'+to+'" data-id="'+id+'"'+(extra||'')+'>'+label+'</button>';

const selQ=(key,opts,label)=>'<select id="s-'+key+'" data-q="'+key+'" aria-label="'+label+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+((ui.q[key]||'')===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';

function go(name,p){ui.stack.push(ui.route);ui.route=Object.assign({name:name},p||{});ui.menu=false;ui.modal=null;render();window.scrollTo(0,0)}

/* ---------- shared widgets ---------- */
function timeline(r){
 const rej=isRej(r);const base=(r.history[0]&&r.history[0].s==='draft')?['draft'].concat(PATH):PATH;
 const steps=rej?r.history.map(h=>({s:h.s,h:h})):base.map(s=>({s:s,h:r.history.find(x=>x.s===s)}));
 const last=steps.reduce((i,x,k)=>x.h?k:i,-1);
 return '<ol class="tl">'+steps.map((x,k)=>{const cls=x.h?(k===last?'cur':'done'):'todo';return '<li class="'+cls+(x.s.indexOf('rejected')===0?' rej':'')+'"><span class="dot"></span><div><b>'+RS[x.s][0]+'</b>'+(x.h?'<small>'+fmtD(x.h.at)+' · '+esc(x.h.by)+'</small>'+(x.h.note?'<p>'+esc(x.h.note)+'</p>':''):'')+'</div></li>'}).join('')+'</ol>'}
function stages(r){
 const has=s=>r.history.some(h=>h.s===s);const rs=r.status==='rejected_station',ri=r.status==='rejected_inspection';
 const box=(n,t,st,sub)=>'<div class="stage '+st+'"><span class="n">'+(st==='done'?ic('check',14):st==='rej'?ic('x',14):n)+'</span><div><b>'+t+'</b><small>'+sub+'</small></div></div>';
 return '<div class="stages" aria-label="مراحل منفصلة">'+
  box(1,'قبول المحطة',has('accepted_station')?'done':rs?'rej':'cur',has('accepted_station')?'ألزمت المحطة نفسها بالشروط':rs?'رفضت المحطة الطلب':'بانتظار رد المحطة')+
  box(2,'اعتماد الفحص الميداني',has('inspection_approved')?'done':ri?'rej':has('accepted_station')?'cur':'','')
  .replace('<small></small>','<small>'+(has('inspection_approved')?'طابقت المعايير ميدانيًا':ri?'لم تطابق المعايير':'بعد قبول المحطة')+'</small>')+
  box(3,'إتمام التعاقد',has('contract_finalized')?'done':has('inspection_approved')?'cur':'','').replace('<small></small>','<small>'+(has('contract_finalized')?'تم الاتفاق عبر المنصة':'بعد اعتماد الفحص')+'</small>')+'</div>'}
function reqTerms(r){const p=P(r.projectId),s=ST(r.stationId);
 return '<section class="card"><h2>شروط طلب التوريد</h2><div class="kvs">'+kv('رقم الطلب',r.no)+kv('المشروع',esc(p.name))+kv('الجهة المنفذة',esc(p.employer))+kv('الجهة المسؤولة',esc(p.sponsor))+kv('المحطة',esc(s.name))+kv('الكمية الإجمالية','<span class="num">'+fq(r.qty)+'</span>')+kv('فترة التوريد',fmtD(r.periodStart)+' – '+fmtD(r.periodEnd))+kv('تاريخ البدء',fmtD(r.startDate))+kv('الجودة المطلوبة',esc(r.quality))+'</div>'+
 '<h3>المعايير والشروط المتفق عليها</h3><ul class="clist">'+r.criteria.map(k=>'<li>'+ic('check',16)+'<span>'+esc(CRIT[k])+'</span></li>').join('')+(r.extra?'<li>'+ic('check',16)+'<span>'+esc(r.extra)+'</span></li>':'')+'</ul></section>'}
function reqRows(list,to,showStation){return list.map(r=>{const p=P(r.projectId),s=ST(r.stationId);return [r.no,esc(p.name)].concat(showStation?[esc(s.name)]:[]).concat([fq(r.qty),reqBadge(r),fmtD(r.history[r.history.length-1].at),goBtn('فتح',to,r.id)])})}
function weekNav(key){const ws=ui[key];return '<div class="pha"><button class="btn sm" data-a="wk" data-k="'+key+'" data-n="-7">'+ic('arrow',14)+' الأسبوع السابق</button><b>'+fmtD(ws)+' – '+fmtD(addDays(ws,6))+'</b><button class="btn sm" data-a="wk" data-k="'+key+'" data-n="7">الأسبوع التالي</button></div>'}
function weekGrid(ws,list,action,showQty,showArea){
 return '<div class="week">'+[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i);const L=list.filter(a=>a.date===d);
  return '<div class="day'+(d===S.today?' today':'')+'"><h3>'+dayName(d)+'<small>'+fmtD(d)+(d===S.today?' · اليوم':'')+'</small></h3>'+(L.map(a=>{const ps=showQty?[AS.find(x=>x[0]===a.status)[1],a.closed?'ok':'info']:pubStatus(a);return '<button class="ap" data-a="'+action+'" data-id="'+a.id+'"><b>'+esc(AR(a.areaId).name)+'</b><span>'+fmtT(a.time)+(showQty?' · '+fq(a.qty):'')+'</span>'+(showQty&&a.closed?badge('مغلقة','ok'):badge(ps[0],showQty?(a.status==='completed'?'ok':a.status==='scheduled'?'info':'warn'):ps[1]))+'</button>'}).join('')||'<p class="muted tiny">لا توجد مواعيد</p>')+'</div>'}).join('')+'</div>'}
function mediaTile(m,a){return '<div><div class="tile">'+(m.url?'<img src="'+m.url+'" alt="'+esc(m.caption||m.name)+'">':ic(m.type==='video'?'video':'camera',34))+'</div><div class="mcap"><b>'+esc(m.caption||m.name)+'</b><span class="muted">'+(m.type==='video'?'فيديو':'صورة')+(a?' · '+esc(AR(a.areaId).name)+' · '+fmtD(a.date):'')+'</span>'+(m.consent?badge('موافقة النشر متوفرة','ok'):badge('بدون موافقة نشر','warn'))+'</div></div>'}

   '<main class="main"><button class="btn menu-btn" data-a="menu" aria-label="القائمة">'+ic('menu')+' القائمة</button>'+view()+'</main></div>'}
 $('#app').innerHTML=h;$('#modal').innerHTML=modalHtml();

function enter(rt){const n=rt.name;
 if(n==='inspect')openForm('insp',{res:{}});

 if(n==='plan'){const r=R(rt.id);openForm('alloc',allocDefaults(r))}

const _go=go;go=function(name,p){const rt=Object.assign({name:name},p||{});enter(rt);_go(name,p)};
function nav(to){ui.route={name:to};ui.stack=[];ui.menu=false;ui.modal=null;enter(ui.route);render();window.scrollTo(0,0)}
function back(){ui.route=ui.stack.pop()||{name:'dashboard'};enter(ui.route);ui.modal=null;render();window.scrollTo(0,0)}
function validate(f,rules){const e={};rules.forEach(r=>{if(!r[1]())e[r[0]]=r[2]});ui.err[f]=e;return !Object.keys(e).length}
const F=f=>D(f);
function confirmM(o){ui.modal={title:o.title,body:o.body,actions:[{label:o.ok,cls:o.cls||'primary',fn:o.fn},{label:'إلغاء'}]};render()}

 togTanker(d){const t=myStation().tankers.find(x=>x.id===d.id);t.state=t.state==='متاح'?'قيد الصيانة':'متاح';render()},
 addTanker(){const f=F('tk');if(!validate('tk',[['plate',()=>f.plate&&f.plate.trim(),'أدخل رقم الصهريج'],['cap',()=>+f.cap>0,'أدخل سعة صحيحة']])){render();return}
  myStation().tankers.push({id:'t'+Date.now(),plate:f.plate.trim(),cap:+f.cap,state:'متاح'});ui.draft.tk={};toast('أُضيف الصهريج');render()},
 /* field coordinator */
 chk(d){const f=F('insp');f.res=f.res||{};f.res[d.k]=d.v;render()},
 approveInsp(d){const r=R(d.id),f=F('insp');r.inspection={res:Object.assign({},f.res),notes:(f.notes||'').trim(),at:S.today};setStatus(r,'inspection_approved','المنسق الميداني','جميع المعايير مطابقة');notify('pc','اعتُمد فحص الطلب '+r.no+' ميدانيًا. بانتظار إتمام التعاقد','request',r.id);toast('اعتُمد الفحص. الخطوة التالية: إتمام التعاقد');go('contract',{id:r.id})},
 rejectInsp(d){const r=R(d.id);confirmM({title:'رفض الطلب بعد الفحص',body:'<p>سيُشعَر منسق المشروع ليختار محطة أخرى. هل تريد رفض الطلب '+r.no+'؟</p>',ok:'تأكيد الرفض',cls:'danger',fn(){const f=F('insp');r.inspection={res:Object.assign({},f.res),notes:(f.notes||'').trim(),at:S.today};setStatus(r,'rejected_inspection','المنسق الميداني',r.inspection.notes);notify('pc','رُفض الطلب '+r.no+' بعد الفحص الميداني','request',r.id);notify('sm:'+r.stationId,'رُفض الطلب '+r.no+' بعد الفحص الميداني','request',r.id);toast('تم رفض الطلب وإشعار منسق المشروع')}})},
 finalize(d){const r=R(d.id);if(!F('ctr').ok){ui.err.ctr={ok:'يلزم تأكيد صحة الاتفاقية'};render();return}
  r.contract={ref:'CT-2026-'+pad(20+S.seq.r),at:S.today};setStatus(r,'contract_finalized','المنسق الميداني','أُتمت الاتفاقية عبر المنصة');setStatus(r,'pending_scheduling','النظام');const p=P(r.projectId);if(p.status==='planning')p.status='active';
  notify('pc','تم التعاقد على الطلب '+r.no,'request',r.id);notify('sm:'+r.stationId,'تم التعاقد على الطلب '+r.no+'. جهّز المياه والصهاريج عند نشر الجدول','request',r.id);toast('تم التعاقد. اختر المناطق وابدأ الجدولة');go('plan',{id:r.id,tab:'areas'})},
 togArea(d){const r=R(ui.route.id);const i=r.plan.findIndex(x=>x.areaId===d.id);
  if(i>=0){if(S.appts.some(a=>a.reqId===r.id&&a.areaId===d.id)){toast('لا يمكن إزالة منطقة لها مواعيد. احذف مواعيدها أولًا','bad');return}r.plan.splice(i,1);delete F('alloc')['q_'+d.id];delete F('alloc')['v_'+d.id]}
  else{r.plan.push({areaId:d.id,qty:0,visits:1});F('alloc')['q_'+d.id]=0;F('alloc')['v_'+d.id]=1}render()},
 saveAlloc(){const r=R(ui.route.id),f=F('alloc');const s=allocSum(r);
  if(s>r.qty){toast('مجموع الكميات يتجاوز الكمية المعتمدة','bad');return}
  for(const x of r.plan){const q=+f['q_'+x.areaId],v=+f['v_'+x.areaId];const sc=sum(S.appts.filter(a=>a.reqId===r.id&&a.areaId===x.areaId),a=>a.qty);
   if(!(q>=0)||!(v>=1)){toast('أدخل كمية وعدد زيارات صحيحين','bad');return}
   if(q<sc){toast('كمية «'+AR(x.areaId).name+'» أقل من المجدول فعليًا ('+fq(sc)+')','bad');return}}
  r.plan.forEach(x=>{x.qty=+f['q_'+x.areaId];x.visits=Math.round(+f['v_'+x.areaId])});toast('حُفظ التخصيص. المتبقي '+fq(r.qty-s));render()},
 addAppt(d){A._apModal(d.id,null)},editAppt(d){const a=AP(d.id);A._apModal(a.reqId,a)},
 _apModal(rid,a){const r=R(rid);openForm('ap',a?{areaId:a.areaId,date:a.date,time:a.time,qty:a.qty,notes:a.sn||''}:{areaId:r.plan[0].areaId,date:S.today>r.periodStart?S.today:r.periodStart,time:'09:00',qty:''});
  ui.modal={title:a?'تعديل موعد التوزيع':'موعد توزيع جديد',body:()=>'<div class="form"><div class="note">المتبقي من الكمية المعتمدة: <b>'+fq(remain(r)+(a?a.qty:0))+'</b></div>'+fld('ap','areaId','المنطقة',{type:'select',opts:r.plan.map(x=>[x.areaId,AR(x.areaId).name+' (مخصص '+x.qty+' م³)']),ro:!!a})+'<div class="grid2">'+fld('ap','date','التاريخ',{type:'date',req:1,min:r.periodStart,max:r.periodEnd})+fld('ap','time','وقت الوصول المتوقع',{type:'time',req:1})+'</div>'+fld('ap','qty','الكمية المخصصة (م³)',{type:'number',min:1,req:1})+fld('ap','notes','ملاحظات (اختيارية)',{type:'textarea',rows:2})+'</div>',
  actions:[{label:a?'حفظ التعديل':'إضافة الموعد',cls:'primary',fn(){const f=F('ap'),q=+f.qty;const other=sum(S.appts.filter(x=>x.reqId===rid&&(!a||x.id!==a.id)),x=>x.qty);const areaS=sum(S.appts.filter(x=>x.reqId===rid&&x.areaId===f.areaId&&(!a||x.id!==a.id)),x=>x.qty);const plan=r.plan.find(x=>x.areaId===f.areaId);
   if(!validate('ap',[['date',()=>f.date&&f.date>=r.periodStart&&f.date<=r.periodEnd,'التاريخ خارج فترة التوريد ('+fmtD(r.periodStart)+' – '+fmtD(r.periodEnd)+')'],['time',()=>f.time,'حدد الوقت'],['qty',()=>q>0&&other+q<=r.qty&&areaS+q<=plan.qty,q>0?(other+q>r.qty?'يتجاوز الكمية المعتمدة. المتاح '+fq(r.qty-other):'يتجاوز المخصص للمنطقة. المتاح '+fq(plan.qty-areaS)):'أدخل كمية أكبر من صفر']])){render();return false}
   if(a){a.date=f.date;a.time=f.time;a.qty=q;a.sn=f.notes}else S.appts.push({id:'a'+(++S.seq.a),reqId:rid,areaId:f.areaId,date:f.date,time:f.time,qty:q,status:'scheduled',actual:'',notes:'',sn:f.notes,closed:false,media:[]});
   toast(a?'عُدّل الموعد':'أُضيف الموعد. المتبقي '+fq(r.qty-other-q))}},{label:'إلغاء'}]};render()},
 delAppt(d){const a=AP(d.id);confirmM({title:'حذف الموعد',body:'<p>سيُحذف موعد «'+esc(AR(a.areaId).name)+'» بتاريخ '+fmtD(a.date)+' وتعود كميته إلى المتبقي.</p>',ok:'حذف',cls:'danger',fn(){S.appts=S.appts.filter(x=>x.id!==a.id);toast('حُذف الموعد')}})},
 autoAppts(d){const r=R(d.id);let n=0,k=0;const base=addDays(S.today>r.periodStart?S.today:r.periodStart,1);
  r.plan.forEach((x,i)=>{const al=S.appts.filter(a=>a.reqId===r.id&&a.areaId===x.areaId);const miss=x.visits-al.length;let rem=x.qty-sum(al,a=>a.qty);if(miss<=0||rem<=0)return;
   const per=Math.floor(rem/miss);for(let j=0;j<miss;j++){const q=j===miss-1?rem:per;rem-=q;if(q<=0)continue;let dt=addDays(base,k*2+(i%2));if(dt>r.periodEnd)dt=r.periodEnd;S.appts.push({id:'a'+(++S.seq.a),reqId:r.id,areaId:x.areaId,date:dt,time:'09:00',qty:q,status:'scheduled',actual:'',notes:'',sn:'',closed:false,media:[]});k++;n++}});
  toast(n?'أُنشئ '+n+' موعدًا مقترحًا، يمكنك تعديلها':'لا توجد مناطق تحتاج إلى مواعيد إضافية');render()},
 publish(d){const r=R(d.id);r.published=true;if(r.status==='pending_scheduling')setStatus(r,'scheduled','المنسق الميداني','نُشر الجدول الأسبوعي');
  notify('sm:'+r.stationId,'نُشر جدول التوزيع للطلب '+r.no+': جهّز الصهاريج','request',r.id);notify('pc','نُشر جدول التوزيع للطلب '+r.no,'request',r.id);toast('نُشر الجدول للعامة');render()},
 completeReq(d){const r=R(d.id);setStatus(r,'completed','المنسق الميداني','اكتملت جميع عمليات التوزيع');notify('pc','اكتمل الطلب '+r.no+' وجميع عملياته مغلقة','project',r.projectId);toast('اعتُمد اكتمال الطلب');render()},
 nextStatus(d){const a=AP(d.id),r=R(a.reqId),nx=nextOf(a);if(!nx)return;a.status=nx[0];if(r.status==='scheduled')setStatus(r,'in_progress','المنسق الميداني');
  if(nx[0]==='completed'){a.actualDate=S.today;a.actualTime=nowT();F('rec').date=a.actualDate;F('rec').time=a.actualTime;toast('اكتمل التوزيع. سجّل الكمية المسلّمة فعليًا')}else toast('الحالة: '+nx[1]);render()},
 saveRec(d){const a=AP(d.id),f=F('rec');if(!validate('rec',[['actual',()=>f.actual!==''&&f.actual!=null&&+f.actual>=0,'أدخل الكمية المسلّمة فعليًا']])){render();return}
  a.actual=+f.actual;a.actualDate=f.date;a.actualTime=f.time;a.notes=f.notes||'';toast('حُفظ سجل التوزيع');render()},
 sampleMedia(d){const a=AP(d.id);a.media.push({id:'m'+Date.now(),type:d.t,name:d.t==='photo'?'صورة.jpg':'فيديو.mp4',caption:d.t==='photo'?'صورة توثيق تجريبية':'مقطع توثيق تجريبي',consent:!!F('md').consent});toast('أُضيف ملف تجريبي (محاكاة)');render()},
 togConsent(d){const m=AP(d.id).media.find(x=>x.id===d.m);m.consent=!m.consent;render()},
 delMedia(d){const a=AP(d.id);a.media=a.media.filter(x=>x.id!==d.m);render()},
 closeAppt(d){const a=AP(d.id);confirmM({title:'إغلاق عملية التوزيع',body:'<p>ستُغلق عملية «'+esc(AR(a.areaId).name)+'» بتاريخ '+fmtD(a.date)+' ولن يمكن تعديلها. لا يُغلق ذلك المشروع نفسه.</p>',ok:'إغلاق العملية',cls:'ok',fn(){a.closed=true;toast('أُغلقت عملية التوزيع')}})},
 evalArea(d){const a=AR(d.id);openForm('ev',Object.assign({},a.ev));const opts=[1,2,3,4,5].map(n=>[n,n+' من 5']);
  ui.modal={title:'تقييم منطقة '+esc(a.name),body:()=>'<p class="muted tiny">تقييم عام لظروف التوزيع. يساعد في القرار ولا يستبعد المنطقة تلقائيًا.</p><div class="grid2">'+EV.map(e=>fld('ev',e[0],e[1],{type:'select',opts:opts})).join('')+'</div>'+fld('ev','note','ملاحظات',{type:'textarea',rows:2}),
  actions:[{label:'حفظ التقييم',cls:'primary',fn(){const f=F('ev');EV.forEach(e=>a.ev[e[0]]=+f[e[0]]);a.ev.note=f.note||'';a.ev.at=S.today;toast('حُدّث التقييم')}},{label:'إلغاء'}]};render()},
 /* shared */
 readAll(){myNotes().forEach(n=>n.read=true);render()},
 openNote(d){const n=S.notes.find(x=>x.id===d.id);n.read=true;const m={request:ui.role==='fc'?'inspect':'request',inspect:'inspect',project:'project',appt:'appt'}[n.ln];if(ui.role==='fc'&&n.ln==='request'){const r=R(n.lid);go(r.status==='pending_inspection'||isRej(r)?'inspect':isApproved(r)||r.status==='inspection_approved'?(r.status==='inspection_approved'?'contract':'plan'):'inspect',{id:n.lid});return}go(m,{id:n.lid})},
 saveProf(){const u=S.users[ui.role],f=F('prof');u.name=f.name||u.name;u.email=f.email;u.phone=f.phone;toast('حُفظت بيانات الحساب');render()},
 mact(d){const m=ui.modal,x=m.actions[+d.i];if(x.fn){if(x.fn()===false)return}ui.modal=null;render()},
 switchRole(d,el){ui.role=el.value;ui.route={name:'dashboard'};ui.stack=[];ui.modal=null;ui.menu=false;enter(ui.route);render();window.scrollTo(0,0)}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('modal-bg')){ui.modal=null;render();return}
 const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.disabled)return;
 const h=A[el.dataset.a];if(h){e.preventDefault();h(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.type==='file')return;
 if(t.dataset.q){ui.q[t.dataset.q]=t.value;render();return}
 if(t.dataset.f){const f=t.dataset.f;if(t.type==='checkbox')return;D(f)[t.name]=t.value;if(live[f])live[f]()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='media-file'){const a=AP(ui.route.id);Array.from(t.files).forEach(file=>{const isV=file.type.indexOf('video')===0;let url='';try{if(!isV)url=URL.createObjectURL(file)}catch(x){}a.media.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),type:isV?'video':'photo',name:file.name,caption:file.name,url:url,consent:!!F('md').consent})});toast('أُضيف '+t.files.length+' ملف');render();return}
 if(t.dataset.a==='switchRole'){A.switchRole(t.dataset,t);return}
 if(t.dataset.f){const f=t.dataset.f;
  if(t.type==='checkbox'){D(f)[t.name]=t.checked;render();return}
  D(f)[t.name]=t.value;
  if(f==='req'&&t.name==='project'){const p=P(t.value);Object.assign(D('req'),{qty:p.qty,quality:p.quality,periodStart:p.start,periodEnd:p.end,startDate:p.start})}
  if(f==='rec'||f==='req'||(t.tagName==='SELECT'&&f!=='ap'&&f!=='ev'))render()}});
render();
})();
</script>
